<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Toddle Tweaks settings</title>
  <link rel="icon" href="../../icons/icon32.png">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Google+Sans+Flex:wght@400;500;700&display=swap">
  <link rel="stylesheet" href="../../options/options.css">
</head>
<body>
  <header class="bar">
    <img src="../../icons/icon48.png" alt="" width="32" height="32">
    <div class="bar-title">Toddle Tweaks <span class="ver" id="ver"></span></div>
    <div class="bar-search"><input id="filter" type="search" placeholder="Search settings" aria-label="Search settings"></div>
    <span id="saved" class="saved" aria-live="polite"></span>
  </header>

  <div class="layout">
    <nav class="toc" id="toc" aria-label="Sections"></nav>
    <main id="main"></main>
  </div>

  <footer class="credits">
    <span>Toddle Tweaks by Jamie Perry</span>
    <span>Classroom banner art belongs to Google. Not affiliated with Toddle or Google.</span>
  </footer>

  <script>
    // Demo stub of the extension APIs so the real settings page renders here.
    window.chrome = { runtime: { getManifest: () => ({ version: "2.3.0" }), openOptionsPage() {}, sendMessage() {} },
      storage: { sync: { async get() { return { settings: { classroomMode: true, googleBanners: true } }; }, async set() {} }, onChanged: { addListener() {} } },
      tabs: { async query() { return []; }, async sendMessage() {} } };
  </script>
  <script src="../../options/options.js"></script>
</body>
</html>
