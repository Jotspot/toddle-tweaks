<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Google+Sans+Flex:wght@400;500;700&display=swap">
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; width: 1400px; height: 560px; overflow: hidden; }
    body { font-family: "Google Sans Flex", "Google Sans", Roboto, Arial, sans-serif; color: #fff; position: relative;
      background: linear-gradient(120deg, #1a73e8 0%, #1967d2 40%, #174ea6 100%); }
    .glow { position: absolute; left: 380px; top: -220px; width: 620px; height: 620px; border-radius: 50%; background: rgba(255,255,255,.07); }
    .brand { position: absolute; left: 72px; top: 70px; display: flex; align-items: center; gap: 14px; font-size: 22px; }
    .brand span { width: 52px; height: 52px; border-radius: 14px; background: #fff; display: flex; align-items: center; justify-content: center; box-shadow: 0 6px 18px rgba(0,0,0,.18); }
    .brand img { width: 40px; height: 40px; }
    h1 { position: absolute; left: 72px; top: 160px; margin: 0; font-weight: 500; font-size: 56px; line-height: 64px; letter-spacing: -.015em; width: 520px; }
    ul { position: absolute; left: 72px; top: 318px; margin: 0; padding: 0; list-style: none; font: 400 19px/34px Roboto, Arial; }
    li::before { content: ""; display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: #8ab4f8; margin: 0 14px 3px 0; }
    .win { position: absolute; left: 640px; top: 64px; width: 864px; height: 540px; border-radius: 14px; overflow: hidden; background: #fff;
      box-shadow: 0 30px 70px rgba(0,0,0,.35); }
    .bar { height: 34px; background: #dee1e6; display: flex; align-items: center; gap: 7px; padding: 0 14px; }
    .bar i { width: 11px; height: 11px; border-radius: 50%; background: #c4c7cc; }
    iframe { border: 0; width: 1440px; height: 900px; transform: scale(.6); transform-origin: 0 0; display: block; }
  </style>
</head>
<body>
  <div class="glow"></div>
  <div class="brand"><span><img src="../../icons/icon128.png" alt=""></span>Toddle Tweaks</div>
  <h1>Toddle, but smarter and faster.</h1>
  <ul>
    <li>A to-do list sorted by what's actually due</li>
    <li>A clean, Classroom-style layout</li>
    <li>Instant pages and quick search (Ctrl+K)</li>
  </ul>
  <div class="win"><div class="bar"><i></i><i></i><i></i></div><iframe src="frame.html?scene=home" scrolling="no"></iframe></div>
</body>
</html>
