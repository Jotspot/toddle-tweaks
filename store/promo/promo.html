<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Toddle Tweaks promo</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Google+Sans+Flex:wght@400;500;700&display=swap">
  <style>
    :root { --ink: #202124; --sub: #5f6368; --blue: #1a73e8; }
    * { box-sizing: border-box; }
    html, body { margin: 0; width: 1280px; height: 800px; overflow: hidden; }
    body { font-family: "Google Sans Flex", "Google Sans", Roboto, Arial, sans-serif; color: var(--ink);
      background: radial-gradient(1200px 600px at 85% -10%, #d2e3fc 0%, rgba(210,227,252,0) 60%), radial-gradient(900px 500px at -10% 110%, #e6f4ea 0%, rgba(230,244,234,0) 60%), #f8fafd; }
    .cap { position: absolute; left: 64px; top: 40px; right: 64px; display: flex; align-items: flex-start; gap: 24px; }
    .cap h1 { font-weight: 500; font-size: 40px; line-height: 48px; margin: 0; letter-spacing: -.01em; }
    .cap p { font-family: Roboto, Arial, sans-serif; font-size: 18px; line-height: 26px; color: var(--sub); margin: 8px 0 0; max-width: 820px; }
    .brand { margin-left: auto; display: flex; align-items: center; gap: 10px; font-size: 18px; color: #3c4043; white-space: nowrap; padding-top: 6px; }
    .brand img { width: 36px; height: 36px; }
    .badge { font: 500 12px/1 Roboto, Arial; padding: 6px 10px; border-radius: 12px; background: #fff; border: 1px solid #dadce0; color: #3c4043; }

    .win { position: absolute; left: 64px; top: 172px; width: 1152px; height: 720px; border-radius: 14px; overflow: hidden; background: #fff;
      box-shadow: 0 24px 60px rgba(32,33,36,.22), 0 4px 14px rgba(32,33,36,.10); border: 1px solid rgba(0,0,0,.08); }
    .chrome-bar { height: 40px; background: #dee1e6; display: flex; align-items: flex-end; padding: 0 12px; gap: 8px; }
    .chrome-bar .dots { display: flex; gap: 7px; align-self: center; margin-right: 8px; }
    .chrome-bar .dots i { width: 11px; height: 11px; border-radius: 50%; background: #c4c7cc; display: block; }
    .chrome-bar .tab { background: #fff; border-radius: 9px 9px 0 0; height: 32px; padding: 0 16px; display: flex; align-items: center; gap: 8px; font: 400 12px Roboto, Arial; color: #3c4043; min-width: 220px; }
    .chrome-bar .tab b { width: 14px; height: 14px; border-radius: 50%; background: var(--blue); display: inline-block; }
    .chrome-url { height: 38px; background: #fff; border-bottom: 1px solid #e8eaed; display: flex; align-items: center; padding: 0 14px; }
    .chrome-url span { background: #f1f3f4; border-radius: 16px; height: 28px; flex: 1; display: flex; align-items: center; padding: 0 14px; font: 400 13px Roboto, Arial; color: #5f6368; }

    .ff-bar { height: 44px; background: #f0f0f4; display: flex; align-items: center; padding: 0 10px; gap: 8px; border-bottom: 1px solid #e0e0e6; }
    .ff-bar .tab { background: #fff; border-radius: 6px; height: 32px; padding: 0 12px; display: flex; align-items: center; gap: 8px; font: 400 12px Roboto, Arial; color: #15141a; min-width: 230px; box-shadow: 0 1px 3px rgba(0,0,0,.12); }
    .ff-bar .tab b { width: 14px; height: 14px; border-radius: 50%; background: var(--blue); display: inline-block; }
    .ff-bar .url { flex: 1; margin-left: 40px; height: 32px; background: #fff; border-radius: 6px; border: 1px solid #e0e0e6; display: flex; align-items: center; padding: 0 12px; font: 400 13px Roboto, Arial; color: #5b5b66; }
    .ff-bar .fx { width: 22px; height: 22px; border-radius: 50%; background: conic-gradient(from 200deg, #ff9500, #ff4f5e, #9059ff, #ff9500); }

    iframe { border: 0; width: 1440px; height: 900px; transform: scale(.8); transform-origin: 0 0; display: block; }
  </style>
</head>
<body>
  <div class="cap">
    <div>
      <h1 id="h"></h1>
      <p id="p"></p>
    </div>
    <div class="brand"><img src="../../icons/icon128.png" alt=""><span>Toddle Tweaks</span><span class="badge" id="b"></span></div>
  </div>
  <div class="win">
    <div id="bar"></div>
    <iframe id="f" scrolling="no"></iframe>
  </div>
  <script>
    const q = new URLSearchParams(location.search);
    const ff = q.get('browser') === 'firefox';
    const scene = q.get('scene') || 'home';
    document.getElementById('h').textContent = q.get('h') || '';
    document.getElementById('p').textContent = q.get('p') || '';
    document.getElementById('b').textContent = ff ? 'for Firefox' : 'for Chrome';
    const tabTitle = scene === 'settings' ? 'Toddle Tweaks settings' : 'Classroom';
    const urlText = scene === 'settings' ? (ff ? 'about:addons › Toddle Tweaks' : 'Extensions › Toddle Tweaks') : 'web.toddleapp.com';
    document.getElementById('bar').innerHTML = ff
      ? '<div class="ff-bar"><div class="tab"><b></b>' + tabTitle + '</div><div class="url">' + urlText + '</div><div class="fx"></div></div>'
      : '<div class="chrome-bar"><div class="dots"><i></i><i></i><i></i></div><div class="tab"><b></b>' + tabTitle + '</div></div><div class="chrome-url"><span>' + urlText + '</span></div>';
    document.getElementById('f').src = scene === 'settings' ? 'settings-frame.html' : 'frame.html?scene=' + scene;
  </script>
</body>
</html>
